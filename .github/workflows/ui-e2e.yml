name: UI end-to-end

on:
  pull_request:
  push:
    branches: [main, feat/automation-foundation]
  workflow_dispatch:

# Fork PRs need no repository secrets and cannot write to the repository.
permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contracts:
    # Match the repository's existing ARM64-pinned PostgreSQL/n8n/Node images.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
          pnpm install --frozen-lockfile
      - name: Static and deterministic checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:e2e:typecheck
          pnpm test
          pnpm build
      - name: Test persisted policy, effort and concurrency contracts
        run: pnpm test:integration
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test real UI, PostgreSQL and n8n
        run: pnpm test:e2e:all
      - name: Retain synthetic-only browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-evidence
          path: |
            playwright-report/
            test-results/e2e/
          retention-days: 7
          if-no-files-found: ignore
